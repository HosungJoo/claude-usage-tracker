<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Claude Usage Tracker 설정</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>설정</h1>
        <p id="status-line" class="status"></p>
      </header>

      <section>
        <h2>알림</h2>

        <div class="field">
          <label for="thresholds">알릴 사용량</label>
          <div class="control">
            <input id="thresholds" type="text" inputmode="numeric" autocomplete="off" />
            <p class="hint">쉼표로 구분한 퍼센트. 이 값을 넘는 순간 한 번씩 알립니다.</p>
            <p class="error" id="thresholds-error" hidden></p>
          </div>
        </div>

        <div class="field">
          <label for="hold">말풍선 표시 시간</label>
          <div class="control">
            <div class="row">
              <input id="hold" type="range" min="0.5" max="3" step="0.1" />
              <output id="hold-out" class="num"></output>
            </div>
            <p class="hint">기본 1배. 길게 두면 놓칠 일이 줄고, 짧게 두면 덜 방해합니다.</p>
          </div>
        </div>

        <div class="field">
          <label for="interval">확인 주기</label>
          <div class="control">
            <div class="row">
              <input id="interval" type="range" min="15" max="600" step="5" />
              <output id="interval-out" class="num"></output>
            </div>
            <p class="hint">자주 확인하면 알림이 빨라지지만 그만큼 요청이 늘어납니다.</p>
          </div>
        </div>
      </section>

      <section>
        <h2>캐릭터</h2>

        <div class="field">
          <label for="character">화면에 띄우기</label>
          <div class="control">
            <label class="switch"><input id="character" type="checkbox" /><span>켜기</span></label>
            <p class="hint">끄면 트레이 아이콘만 사용량을 알려줍니다.</p>
          </div>
        </div>

        <div class="field">
          <label for="anchor">기준</label>
          <div class="control">
            <select id="anchor"></select>
            <p class="hint" id="anchor-hint"></p>
          </div>
        </div>

        <div class="field">
          <label for="corner">나타나는 위치</label>
          <div class="control">
            <select id="corner"></select>
          </div>
        </div>

        <div class="field">
          <label for="margin">가장자리 여백</label>
          <div class="control">
            <div class="row">
              <input id="margin" type="range" min="0" max="200" step="4" />
              <output id="margin-out" class="num"></output>
            </div>
          </div>
        </div>

        <div class="field">
          <label>미리 보기</label>
          <div class="control">
            <button id="preview" type="button" class="ghost">지금 띄워 보기</button>
            <p class="hint">현재 설정 그대로 캐릭터를 한 번 띄웁니다.</p>
          </div>
        </div>
      </section>

      <section>
        <h2>세션 연동</h2>

        <div class="field">
          <label for="greet">시작할 때 인사</label>
          <div class="control">
            <label class="switch"><input id="greet" type="checkbox" /><span>켜기</span></label>
            <p class="hint">Claude Code 세션을 켜면 남은 사용량을 알려줍니다.</p>
          </div>
        </div>

        <div class="field">
          <label>Claude Code 훅</label>
          <div class="control">
            <div class="row">
              <button id="hook-toggle" type="button"></button>
              <span id="hook-state" class="pill"></span>
            </div>
            <p class="hint">
              세션 시작·종료를 감지하려면 훅이 필요합니다. 설치해도 이 앱이 꺼져 있으면
              아무 일도 하지 않습니다.
            </p>
          </div>
        </div>
      </section>

      <section>
        <h2>시스템</h2>

        <div class="field">
          <label for="autostart">로그인 시 자동 실행</label>
          <div class="control">
            <label class="switch"><input id="autostart" type="checkbox" /><span>켜기</span></label>
          </div>
        </div>

        <div class="field">
          <label>진단</label>
          <div class="control">
            <div class="row">
              <button id="open-logs" type="button" class="ghost">로그 폴더 열기</button>
              <button id="reset" type="button" class="ghost danger">기본값으로 되돌리기</button>
            </div>
            <p class="hint" id="paths"></p>
          </div>
        </div>
      </section>

      <footer>
        <p id="saved" class="saved" hidden>저장했습니다</p>
      </footer>
    </main>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
