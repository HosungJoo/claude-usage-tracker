<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title data-i18n="windowTitle">Claude Usage Tracker</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="heading">Settings</h1>
        <p id="status-line" class="status"></p>
      </header>

      <section>
        <h2 data-i18n="sectionAlerts">Alerts</h2>

        <div class="field">
          <label for="thresholds" data-i18n="thresholds">Alert at</label>
          <div class="control">
            <input id="thresholds" type="text" inputmode="numeric" autocomplete="off" />
            <p class="hint" data-i18n="thresholdsHint"></p>
            <p class="error" id="thresholds-error" hidden></p>
          </div>
        </div>

        <div class="field">
          <label for="hold" data-i18n="holdTime">Hold time</label>
          <div class="control">
            <div class="row">
              <input id="hold" type="range" min="1" max="30" step="1" />
              <output id="hold-out" class="num"></output>
            </div>
            <p class="hint" data-i18n="holdHint"></p>
          </div>
        </div>

        <div class="field">
          <label for="wait-away" data-i18n="waitWhenAway">Wait if away</label>
          <div class="control">
            <label class="switch"><input id="wait-away" type="checkbox" /><span data-i18n="on"></span></label>
            <p class="hint" data-i18n="waitAwayHint"></p>
          </div>
        </div>

        <div class="field">
          <label for="interval" data-i18n="pollInterval">Check every</label>
          <div class="control">
            <div class="row">
              <input id="interval" type="range" min="15" max="600" step="5" />
              <output id="interval-out" class="num"></output>
            </div>
            <p class="hint" data-i18n="pollHint"></p>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="sectionCharacter">Character</h2>

        <div class="field">
          <label for="character" data-i18n="showOnScreen">Show on screen</label>
          <div class="control">
            <label class="switch"><input id="character" type="checkbox" /><span data-i18n="on"></span></label>
            <p class="hint" data-i18n="showHint"></p>
          </div>
        </div>

        <div class="field">
          <label for="display" data-i18n="whichMonitor">Which monitor</label>
          <div class="control">
            <select id="display"></select>
            <p class="hint" id="display-hint"></p>
          </div>
        </div>

        <div class="field">
          <label for="anchor" data-i18n="anchor">Anchor</label>
          <div class="control">
            <select id="anchor"></select>
            <p class="hint" id="anchor-hint"></p>
          </div>
        </div>

        <div class="field">
          <label for="corner" data-i18n="corner">Corner</label>
          <div class="control">
            <select id="corner"></select>
          </div>
        </div>

        <div class="field">
          <label for="margin" data-i18n="margin">Edge margin</label>
          <div class="control">
            <div class="row">
              <input id="margin" type="range" min="0" max="200" step="4" />
              <output id="margin-out" class="num"></output>
            </div>
          </div>
        </div>

        <div class="field">
          <label data-i18n="preview">Preview</label>
          <div class="control">
            <button id="preview" type="button" class="ghost" data-i18n="previewButton"></button>
            <p class="hint" data-i18n="previewHint"></p>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="sectionSession">Session</h2>

        <div class="field">
          <label for="greet" data-i18n="greetOnStart">Greet on start</label>
          <div class="control">
            <label class="switch"><input id="greet" type="checkbox" /><span data-i18n="on"></span></label>
            <p class="hint" data-i18n="greetHint"></p>
          </div>
        </div>

        <div class="field">
          <label data-i18n="hooks">Claude Code hooks</label>
          <div class="control">
            <div class="row">
              <button id="hook-toggle" type="button"></button>
              <span id="hook-state" class="pill"></span>
            </div>
            <p class="hint" data-i18n="hooksHint"></p>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="sectionSystem">System</h2>

        <div class="field">
          <label for="language" data-i18n="language">Language</label>
          <div class="control">
            <select id="language"></select>
          </div>
        </div>

        <div class="field">
          <label for="autostart" data-i18n="autostart">Start on login</label>
          <div class="control">
            <label class="switch"><input id="autostart" type="checkbox" /><span data-i18n="on"></span></label>
          </div>
        </div>

        <div class="field">
          <label data-i18n="sectionDiagnostics">Diagnostics</label>
          <div class="control">
            <div class="row">
              <button id="open-logs" type="button" class="ghost" data-i18n="openLogFolder"></button>
              <button id="reset" type="button" class="ghost danger" data-i18n="resetDefaults"></button>
            </div>
            <p class="hint" id="paths"></p>
          </div>
        </div>
      </section>

      <footer>
        <p id="saved" class="saved" data-i18n="saved" hidden></p>
      </footer>
    </main>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
